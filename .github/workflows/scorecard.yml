name: OpenSSF Scorecard
# Scores this repository's supply-chain practices (https://scorecard.dev) on
# the default branch, weekly and when branch protection changes. Results are
# published to the public Scorecard API (scorecard.dev) and kept as a
# workflow artifact for a week; they are not uploaded to code scanning, so
# Scorecard's checks are read from the published score, not as code-scanning
# alerts. The job keeps to what the Scorecard publishing service accepts:
# read-only by default, pinned actions, no top-level env.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  branch_protection_rule:
  workflow_dispatch:
permissions: read-all
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Sign the published results with the workflow's OIDC identity.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 7
